name: Build NIHIRA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write local.properties (API key comes from GitHub Secrets)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> local.properties
          echo "GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}" >> local.properties
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> local.properties
          echo "CLAUDE_MODEL=${CLAUDE_MODEL:-claude-haiku-5-5}" >> local.properties

      - name: Use the same signing key every build (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: NIHIRA-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
